<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>US & HK Stock AI Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
body{background:#f3f4f6;padding:20px;}
h1{text-align:center;color:#111827;margin-bottom:8px;font-size:24px;}
.desc{text-align:center;color:#b91c1c;margin-bottom:24px;font-size:14px;max-width:1100px;margin-left:auto;margin-right:auto;}
.wrap{max-width:1250px;margin:0 auto;background:#ffffff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.1);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:13px 6px;text-align:center;border-bottom:1px solid #e5e7eb;font-size:14px;}
th{background:#111827;color:#ffffff;font-weight:500;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#eef2ff;}

.up{color:#16a34a;font-weight:bold;}
.down{color:#dc2626;font-weight:bold;}
.flat{color:#6b7280;font-weight:bold;}
.oversold{color:#2563eb;font-weight:bold;}
.overbought{color:#f97316;font-weight:bold;}
.normal{color:#333333;font-weight:bold;}

/* Popup Modal */
.modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:none;align-items:center;justify-content:center;z-index:9999;
}
.modal-card{
    background:#fff;padding:26px;border-radius:12px;min-width:330px;max-width:460px;
}
.modal-card h2{margin-bottom:18px;font-size:20px;color:#111827;}
.modal-item{margin:11px 0;font-size:15px;}
.btn-close{margin-top:18px;padding:9px 18px;background:#111827;color:#fff;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<h1>US & HK Stock AI Dashboard</h1>
<div class="desc">⚠️ Disclaimer: For demonstration only, NOT investment advice. Click table row to view details.</div>
<div class="wrap">
<table>
<thead>
<tr>
<th>Name</th>
<th>Code</th>
<th>Price</th>
<th>AI‑Buy</th>
<th>AI‑Target</th>
<th>RSI14</th>
<th>Status</th>
<th>3D</th>
<th>7D</th>
<th>14D</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="modal-overlay" id="overlay">
    <div class="modal-card">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <button class="btn-close" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
// ==============================================
// PASTE YOUR PYTHON‑GENERATED JSON ARRAY HERE
// Replace this sample array with real output from your Python script
// ==============================================
const stockData = [
  {
    "name":"Apple Inc.",
    "code":"AAPL",
    "price":227.32,
    "aiBuy":215.10,
    "aiTarget":242.50,
    "rsi14":48.20,
    "status":"normal",
    "t3":"up",
    "t7":"flat",
    "t14":"up"
  },
  {
    "name":"Tencent Holdings Limited",
    "code":"00700.HK",
    "price":392.60,
    "aiBuy":365.20,
    "aiTarget":435.00,
    "rsi14":27.50,
    "status":"oversold",
    "t3":"down",
    "t7":"down",
    "t14":"flat"
  }
];

// render helpers
function trendHtml(t){
    if(t==="up") return `<span class="up">🟢Up</span>`;
    if(t==="down") return `<span class="down">🔴Down</span>`;
    return `<span class="flat">⚪Flat</span>`;
}
function statusHtml(s){
    if(s==="oversold") return `<span class="oversold">✅Oversold</span>`;
    if(s==="overbought") return `<span class="overbought">⚠️Overbought</span>`;
    return `<span class="normal">➖Normal</span>`;
}

function renderTable(){
    const tb = document.getElementById("tableBody");
    tb.innerHTML = "";
    stockData.forEach((item,idx)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.code}</td>
            <td>${item.price}</td>
            <td>${item.aiBuy}</td>
            <td>${item.aiTarget}</td>
            <td>${item.rsi14}</td>
            <td>${statusHtml(item.status)}</td>
            <td>${trendHtml(item.t3)}</td>
            <td>${trendHtml(item.t7)}</td>
            <td>${trendHtml(item.t14)}</td>
        `;
        tr.onclick = ()=>openPopup(idx);
        tb.appendChild(tr);
    })
}

function openPopup(index){
    const d = stockData[index];
    document.getElementById("modalTitle").textContent = `${d.name} (${d.code})`;
    document.getElementById("modalBody").innerHTML = `
        <div class="modal-item">Price: ${d.price}</div>
        <div class="modal-item">AI‑Buy Price: ${d.aiBuy}</div>
        <div class="modal-item">AI‑Target Price: ${d.aiTarget}</div>
        <div class="modal-item">RSI(14): ${d.rsi14}</div>
        <div class="modal-item">Status: ${d.status==="oversold"?"✅Oversold":d.status==="overbought"?"⚠️Overbought":"➖Normal"}</div>
        <div class="modal-item">3‑Day Trend: ${d.t3==="up"?"Up":d.t3==="down"?"Down":"Flat"}</div>
        <div class="modal-item">7‑Day Trend: ${d.t7==="up"?"Up":d.t7==="down"?"Down":"Flat"}</div>
        <div class="modal-item">14‑Day Trend: ${d.t14==="up"?"Up":d.t14==="down"?"Down":"Flat"}</div>
    `;
    document.getElementById("overlay").style.display="flex";
}
function closeModal(){
    document.getElementById("overlay").style.display="none";
}

renderTable();
</script>
</body>
</html>
